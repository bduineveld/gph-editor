<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPH editor</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%232f6fc4%27/%3E%3Crect x=%273%27 y=%273%27 width=%274%27 height=%274%27 fill=%27%23fff%27/%3E%3Crect x=%279%27 y=%273%27 width=%274%27 height=%274%27 fill=%27%23fff%27 opacity=%27.6%27/%3E%3Crect x=%273%27 y=%279%27 width=%274%27 height=%274%27 fill=%27%23fff%27 opacity=%27.6%27/%3E%3Crect x=%279%27 y=%279%27 width=%274%27 height=%274%27 fill=%27%23fff%27 opacity=%27.3%27/%3E%3C/svg%3E">
</head>
<body>
<header id="top">
  <a class="brand" href="#" title="Overview"><span class="logo"></span>GPH editor</a>
  <nav id="tabs"></nav>
  <div class="search"><input id="search" type="search" placeholder="Search screens and texts…" autocomplete="off"><div id="search-results" hidden></div></div>
  <div id="settings" class="settings"></div>
  <button id="btn-files" title="The files that are open: download, undo, close, open more"></button>
</header>
<div id="layout">
  <nav id="rail" hidden></nav>
  <main id="main"></main>
  <aside id="detail" hidden></aside>
</div>
<aside id="drawer" hidden></aside>
<div id="modal" hidden><div class="modal-box" role="dialog"></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
